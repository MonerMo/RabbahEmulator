org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official
# Where the JDK 17 toolchain lives (core uses jvmToolchain(17)); lets Android Studio's
# bundled Gradle runtime find it without relying on JAVA_HOME.
org.gradle.java.installations.paths=D:/dev/jdk-17/jdk-17.0.20.1+1
# Android Gradle Plugin 9 in the same "classic" mode the React Native app uses,
# so both builds share one set of downloaded artifacts and behave the same.
android.builtInKotlin=false
android.newDsl=false
android.useAndroidX=true
